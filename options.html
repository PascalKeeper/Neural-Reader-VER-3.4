<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Settings</title>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:"Segoe UI",sans-serif;padding:40px;max-width:600px;margin:0 auto}
h1{border-bottom:2px solid #00f3ff;padding-bottom:10px}
.row{background:#1e293b;padding:20px;border-radius:8px;margin-bottom:20px;border:1px solid #334155}
select{width:100%;padding:10px;background:#0f172a;color:white;border:1px solid #475569}
</style></head>
<body>
<h1>Settings</h1>
<div class="row"><label>Microphone</label><select id="mic"></select></div>
<div class="row"><label>Language</label><select id="lang">
<option value="en-US">English (US)</option><option value="en-GB">English (UK)</option>
<option value="es-ES">Spanish</option><option value="fr-FR">French</option>
<option value="de-DE">German</option><option value="ja-JP">Japanese</option>
</select></div>
<div style="text-align:center;font-size:10px;color:#64748b">Architected by Joseph Rocco Peransi</div>
