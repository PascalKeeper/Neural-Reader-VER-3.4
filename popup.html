<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 340px; background: #0f172a; color: #e2e8f0; font-family: "Segoe UI", sans-serif; padding: 16px; border-bottom: 2px solid #00f3ff; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { font-size: 14px; margin: 0; color: white; }
        .badge { background: #00f3ff; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 800; }
        .btn-icon { background: none; border: none; color: #64748b; cursor: pointer; } .btn-icon:hover { color: #00f3ff; }
        textarea { width: 100%; height: 80px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 8px; box-sizing: border-box; border-radius: 6px; resize: none; outline: none; }
        textarea:focus { border-color: #00f3ff; color: white; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin: 12px 0; }
        button { border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #btn-mic { background: #1e293b; color: white; border: 1px solid #334155; }
        #btn-mic.rec { background: #ef4444; border-color: #ef4444; animation: pulse 1.5s infinite; }
        #btn-stop { background: #1e293b; color: #ef4444; border: 1px solid #334155; }
        #btn-read { grid-column: span 2; background: #00f3ff; color: #0f172a; }
        #btn-exit { width: 100%; background: #1e293b; color: #94a3b8; border: 1px solid #334155; margin-top: 8px; }
        label { display: block; font-size: 9px; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        input[type=range] { width: 100%; }
        select { width: 100%; background: #0f172a; color: white; border: 1px solid #334155; padding: 4px; }
        #status { font-size: 10px; color: #00f3ff; text-align: center; margin-top: 8px; }
        .footer { margin-top: 15px; border-top: 1px solid #334155; text-align: center; font-size: 9px; color: #475569; padding-top: 5px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="header"><h1>NEURAL<span>READER</span> <span class="badge">V3.4</span></h1><button id="btn-opt" class="btn-icon">⚙️</button></div>
    <textarea id="txt" placeholder="Waiting for text..."></textarea>
    <div class="grid">
        <button id="btn-mic">🎤</button><button id="btn-stop">■</button><button id="btn-read">▶ READ</button>
    </div>
    <button id="btn-exit">✕ EXIT</button>
    <div style="margin-bottom:8px"><label>Speed</label><input type="range" id="rate" min="0.5" max="3.0" step="0.1" value="1.0"></div>
    <div><label>Voice</label><select id="voice"><option>Scanning...</option></select></div>
    <div id="status">Ready</div>
    <div class="footer">Architected by Joseph Rocco Peransi</div>
    <script src="popup.js"></script>
</body>
</html>
